<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Doctolib ★ Notes Google</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      color: #202124;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
    }
    p.sub {
      font-size: 12px;
      color: #5f6368;
      margin: 0 0 14px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    input[type="password"],
    input[type="text"] {
      flex: 1;
      padding: 7px 9px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #1a73e8;
      color: #fff;
    }
    button.secondary {
      background: #f1f3f4;
      color: #202124;
    }
    #status {
      font-size: 12px;
      margin-top: 10px;
      min-height: 16px;
    }
    .ok { color: #1e8e3e; }
    .warn { color: #d93025; }
    .cache-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #5f6368;
    }
    a { color: #1a73e8; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Notes Google pour Doctolib</h1>
  <p class="sub">Affiche la note Google des praticiens dans les résultats Doctolib.</p>

  <label for="key">Clé Google Places API personnelle (optionnel)</label>
  <p class="sub">Laissez vide pour utiliser le service partagé. Renseignez votre
  propre clé pour des requêtes illimitées et directes.</p>
  <div class="row">
    <input type="password" id="key" placeholder="AIza... (optionnel)" autocomplete="off" />
    <button id="save">Enregistrer</button>
  </div>
  <div id="status"></div>

  <p>
    <a href="https://console.cloud.google.com/apis/library/places-backend.googleapis.com" target="_blank">
      Obtenir une clé (Google Cloud Console) →
    </a>
  </p>

  <div class="cache-row">
    <span id="cacheInfo">Cache : …</span>
    <button class="secondary" id="clearCache">Vider le cache</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
